persistence true
persistence_location /mosquitto/data/
autosave_interval 30
autosave_on_changes true

# Reap stale persistent sessions from clients that never reconnect.
persistent_client_expiration 7d

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acl

# Keep memory bounded during bursts while still allowing QoS1 retries.
max_queued_messages 1000
max_inflight_messages 100
message_size_limit 1048576

# Operational logging for demo/debug visibility.
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Optional hardening knobs (enable later if you move to TLS listener 8883):
# allow_zero_length_clientid false
# use_identity_as_username true
