##==========================================================
## NanoMQ Configuration
##==========================================================

## -------- MQTT Settings --------
mqtt {
    # Listening address (default: 0.0.0.0:1883)
    # Allows all network interfaces
    bind = 0.0.0.0:1883

    # Maximum number of MQTT clients
    max_clients = 1024

    # Maximum packet size (bytes)
    max_packet_size = 4MB
}

## -------- WebSocket Support (Optional) --------
# If you want to allow MQTT over WebSocket (useful for dashboards)
websocket {
    enable = true
    port = 8081
}

## -------- Logging --------
log {
    level = info       # debug | info | warn | error
    file = "/var/log/nanomq.log"
}

## -------- Authorization --------
# Disable authentication for simplicity in local setup.
# You can enable ACL or username/password later.
auth {
    enable = false
}

## -------- Bridging / Forwarding --------
# (Optional) Use if you want to forward messages to another broker
bridge {
    enable = false
}

## -------- Retained Messages --------
# Retained messages are off by default (set true if needed)
retain_available = true
