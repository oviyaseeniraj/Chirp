<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chirp — Bird's-Eye Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: 'SF Mono', 'Fira Code', monospace;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ─────────────────────────────────────────────── */
    #sidebar {
      width: 220px;
      min-width: 220px;
      background: #161b22;
      border-right: 1px solid #30363d;
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      gap: 20px;
      overflow-y: auto;
    }

    #sidebar h1 {
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #58a6ff;
      border-bottom: 1px solid #30363d;
      padding-bottom: 10px;
    }

    .section-title {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #6e7681;
      margin-bottom: 6px;
    }

    /* calibration badge */
    #calib-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 6px;
      background: #1c2128;
      border: 1px solid #30363d;
    }

    #calib-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #3a3a3a;
      flex-shrink: 0;
      transition: background 0.4s;
    }

    #calib-dot.ok   { background: #3fb950; box-shadow: 0 0 6px #3fb950aa; }
    #calib-dot.none { background: #f78166; }

    /* node list */
    #node-list { display: flex; flex-direction: column; gap: 6px; }

    .node-card {
      display: flex; align-items: center; gap: 8px;
      background: #1c2128;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 11px;
      transition: border-color 0.3s;
    }
    .node-card.stale { opacity: 0.45; }

    .node-dot {
      width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
    }

    .node-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .node-count { color: #8b949e; }

    /* scale controls */
    #controls { display: flex; flex-direction: column; gap: 8px; }

    label { font-size: 10px; color: #8b949e; display: flex; flex-direction: column; gap: 4px; }

    input[type=range] {
      width: 100%;
      accent-color: #58a6ff;
    }

    input[type=checkbox] { accent-color: #58a6ff; }

    .ctrl-row {
      display: flex; align-items: center; gap: 6px; font-size: 11px; color: #c9d1d9;
    }

    /* stats footer */
    #stats {
      margin-top: auto;
      font-size: 10px;
      color: #6e7681;
      line-height: 1.7;
      border-top: 1px solid #30363d;
      padding-top: 10px;
    }

    /* ── Main canvas area ────────────────────────────────────── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    #topbar {
      height: 36px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      font-size: 11px;
      color: #8b949e;
      flex-shrink: 0;
    }

    #topbar .tag {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 10px;
    }

    #canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #bev-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
    }

    /* uncalibrated overlay banner */
    #uncal-banner {
      position: absolute;
      top: 12px; left: 50%; transform: translateX(-50%);
      background: #5a1e02cc;
      border: 1px solid #f78166;
      border-radius: 8px;
      padding: 6px 20px;
      font-size: 11px;
      color: #f78166;
      letter-spacing: 1px;
      pointer-events: none;
      display: none;
    }
    #uncal-banner.visible { display: block; }

    /* FPS indicator */
    #fps-counter {
      position: absolute;
      bottom: 8px; right: 12px;
      font-size: 10px;
      color: #6e7681;
      pointer-events: none;
    }
  </style>
</head>
<body>

<!-- ── Sidebar ── -->
<div id="sidebar">
  <h1>Chirp</h1>

  <div>
    <div class="section-title">Calibration</div>
    <div id="calib-badge">
      <div id="calib-dot" class="none"></div>
      <span id="calib-label">Uncalibrated</span>
    </div>
  </div>

  <div>
    <div class="section-title">Nodes</div>
    <div id="node-list"><em style="font-size:11px;color:#6e7681">Waiting for nodes…</em></div>
  </div>

  <div id="controls">
    <div class="section-title">View</div>

    <label>
      Scale (m/div)
      <input type="range" id="scale-slider" min="1" max="20" step="0.5" value="5" />
      <span id="scale-val">5 m</span>
    </label>

    <div class="ctrl-row">
      <input type="checkbox" id="show-grid" checked />
      <span>Grid</span>
    </div>
    <div class="ctrl-row">
      <input type="checkbox" id="show-nodes" checked />
      <span>Node positions</span>
    </div>
    <div class="ctrl-row">
      <input type="checkbox" id="show-doppler" />
      <span>Colour by Doppler</span>
    </div>
    <div class="ctrl-row">
      <input type="checkbox" id="show-trails" checked />
      <span>Trails</span>
    </div>
  </div>

  <div id="stats">
    <div id="stat-fps">FPS —</div>
    <div id="stat-points">Points —</div>
    <div id="stat-nodes">Nodes —</div>
  </div>
</div>

<!-- ── Canvas area ── -->
<div id="main">
  <div id="topbar">
    <span>Bird's-Eye View</span>
    <span class="tag" id="group-tag">group: —</span>
    <span class="tag" id="cmd-tag">cmd: —</span>
  </div>
  <div id="canvas-wrap">
    <canvas id="bev-canvas"></canvas>
    <div id="uncal-banner">⚠ UNCALIBRATED — nodes shown in local frames</div>
    <div id="fps-counter">— fps</div>
  </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
// ── Canvas setup ──────────────────────────────────────────────────────────
const canvas = document.getElementById('bev-canvas');
const ctx    = canvas.getContext('2d');

function resize() {
  const wrap = canvas.parentElement;
  canvas.width  = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
}
resize();
window.addEventListener('resize', resize);

// ── Controls ──────────────────────────────────────────────────────────────
const scaleSlider  = document.getElementById('scale-slider');
const scaleVal     = document.getElementById('scale-val');
const showGrid     = document.getElementById('show-grid');
const showNodes    = document.getElementById('show-nodes');
const showDoppler  = document.getElementById('show-doppler');
const showTrails   = document.getElementById('show-trails');

let metersPerDiv = parseFloat(scaleSlider.value);
scaleSlider.addEventListener('input', () => {
  metersPerDiv = parseFloat(scaleSlider.value);
  scaleVal.textContent = metersPerDiv + ' m';
});

// pixels per metre — recomputed each frame based on canvas size
function pxPerM() {
  return Math.min(canvas.width, canvas.height) / (metersPerDiv * 6);
}

// world → canvas
function toCanvas(x, y) {
  const s = pxPerM();
  return [
    canvas.width  / 2 + x * s,
    canvas.height / 2 - y * s,   // y-up
  ];
}

// ── Trail storage ─────────────────────────────────────────────────────────
const TRAIL_LEN = 12;
const trails = {};   // node_id -> [ {x,y,color,mass} ]

// ── Doppler → hue helper ──────────────────────────────────────────────────
function dopplerToColor(dps) {
  // dps: m/s, positive = approaching, negative = receding
  const clamped = Math.max(-3, Math.min(3, dps));
  if (clamped > 0) {
    const t = clamped / 3;
    return `rgba(255,${Math.round(180*(1-t))},${Math.round(80*(1-t))},0.9)`;
  } else {
    const t = -clamped / 3;
    return `rgba(${Math.round(80*(1-t))},${Math.round(180*(1-t))},255,0.9)`;
  }
}

// ── Drawing ───────────────────────────────────────────────────────────────
function drawGrid(s) {
  if (!showGrid.checked) return;
  ctx.save();
  const cx = canvas.width  / 2;
  const cy = canvas.height / 2;

  // Concentric range circles
  ctx.strokeStyle = '#1f2937';
  ctx.lineWidth   = 1;
  const maxR = Math.max(canvas.width, canvas.height) / s * 0.8;
  for (let r = metersPerDiv; r < maxR; r += metersPerDiv) {
    const pr = r * s;
    ctx.beginPath();
    ctx.arc(cx, cy, pr, 0, Math.PI * 2);
    ctx.stroke();

    // range label
    ctx.fillStyle = '#374151';
    ctx.font = '9px monospace';
    ctx.fillText(`${r}m`, cx + pr + 3, cy - 3);
  }

  // Radial lines every 30°
  ctx.strokeStyle = '#1a2030';
  for (let deg = 0; deg < 360; deg += 30) {
    const rad = (deg * Math.PI) / 180;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.sin(rad) * maxR * s, cy - Math.cos(rad) * maxR * s);
    ctx.stroke();
  }

  // Cross-hairs
  ctx.strokeStyle = '#21262d';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx, 0);          ctx.lineTo(cx, canvas.height); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, cy);           ctx.lineTo(canvas.width, cy);  ctx.stroke();

  ctx.restore();
}

function drawNodePositions(nodePositions, s) {
  if (!showNodes.checked || !nodePositions) return;
  ctx.save();
  for (const np of nodePositions) {
    const [cx, cy] = toCanvas(np.x, np.y);
    const size = 8;
    // diamond shape
    ctx.beginPath();
    ctx.moveTo(cx,        cy - size);
    ctx.lineTo(cx + size, cy);
    ctx.lineTo(cx,        cy + size);
    ctx.lineTo(cx - size, cy);
    ctx.closePath();
    ctx.fillStyle   = np.color + '33';
    ctx.strokeStyle = np.color;
    ctx.lineWidth   = 1.5;
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = np.color;
    ctx.font = '9px monospace';
    ctx.fillText(np.node_id, cx + size + 4, cy + 4);
  }
  ctx.restore();
}

function drawTrails(s) {
  if (!showTrails.checked) return;
  ctx.save();
  for (const [nid, pts] of Object.entries(trails)) {
    for (let i = 0; i < pts.length; i++) {
      const pt = pts[i];
      const alpha = (i / pts.length) * 0.35;
      const [px, py] = toCanvas(pt.x, pt.y);
      const r = Math.max(2, Math.sqrt(pt.mass / 30));
      ctx.beginPath();
      ctx.arc(px, py, r * 0.7, 0, Math.PI * 2);
      ctx.fillStyle = pt.color + Math.round(alpha * 255).toString(16).padStart(2, '0');
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawPoints(points, s) {
  ctx.save();
  for (const pt of points) {
    if (pt.stale) continue;
    const [px, py] = toCanvas(pt.x, pt.y);
    const r = Math.max(3, Math.min(14, Math.sqrt(pt.mass / 20)));

    const color = showDoppler.checked
      ? dopplerToColor(pt.doppler_mps)
      : pt.color;

    // glow
    const grad = ctx.createRadialGradient(px, py, 0, px, py, r * 2.5);
    grad.addColorStop(0, color + 'aa');
    grad.addColorStop(1, color + '00');
    ctx.beginPath();
    ctx.arc(px, py, r * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // core dot
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();

    // update trail
    if (!trails[pt.node_id]) trails[pt.node_id] = [];
    trails[pt.node_id].push({ x: pt.x, y: pt.y, color: pt.color, mass: pt.mass });
    if (trails[pt.node_id].length > TRAIL_LEN) trails[pt.node_id].shift();
  }
  ctx.restore();
}

function drawScaleBar(s) {
  const barM   = metersPerDiv;
  const barPx  = barM * s;
  const x0     = 20;
  const y0     = canvas.height - 20;
  ctx.save();
  ctx.strokeStyle = '#58a6ff';
  ctx.lineWidth   = 2;
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x0 + barPx, y0);
  ctx.moveTo(x0, y0 - 4);
  ctx.lineTo(x0, y0 + 4);
  ctx.moveTo(x0 + barPx, y0 - 4);
  ctx.lineTo(x0 + barPx, y0 + 4);
  ctx.stroke();
  ctx.fillStyle = '#58a6ff';
  ctx.font = '10px monospace';
  ctx.fillText(`${barM} m`, x0 + barPx / 2 - 10, y0 - 8);
  ctx.restore();
}

// ── Sidebar updates ───────────────────────────────────────────────────────
const calibDot   = document.getElementById('calib-dot');
const calibLabel = document.getElementById('calib-label');
const nodeList   = document.getElementById('node-list');
const uncalBanner= document.getElementById('uncal-banner');
const groupTag   = document.getElementById('group-tag');
const cmdTag     = document.getElementById('cmd-tag');

function updateSidebar(data) {
  // calibration
  if (data.calibrated) {
    calibDot.className   = 'ok';
    calibLabel.textContent = 'Calibrated';
    uncalBanner.classList.remove('visible');
  } else {
    calibDot.className   = 'none';
    calibLabel.textContent = 'Uncalibrated';
    uncalBanner.classList.add('visible');
  }

  if (data.calibration_command_id) {
    cmdTag.textContent = 'cmd: ' + data.calibration_command_id.slice(0, 14) + '…';
  }
  if (data.node_ids && data.node_ids.length) {
    groupTag.textContent = 'nodes: ' + data.node_ids.length;
  }

  // node cards
  if (data.node_status && data.node_status.length) {
    nodeList.innerHTML = '';
    for (const ns of data.node_status) {
      const card = document.createElement('div');
      card.className = 'node-card' + (ns.stale ? ' stale' : '');
      card.innerHTML = `
        <div class="node-dot" style="background:${ns.color};box-shadow:0 0 5px ${ns.color}88"></div>
        <span class="node-name" title="${ns.node_id}">${ns.node_id}</span>
        <span class="node-count">${ns.cluster_count}</span>
      `;
      nodeList.appendChild(card);
    }
  } else if (data.presence && data.presence.length) {
    nodeList.innerHTML = '';
    for (const p of data.presence) {
      const card = document.createElement('div');
      card.className = 'node-card' + (p.status !== 'online' ? ' stale' : '');
      card.innerHTML = `
        <div class="node-dot" style="background:${p.color}"></div>
        <span class="node-name" title="${p.node_id}">${p.node_id}</span>
        <span class="node-count" style="color:${p.status==='online'?'#3fb950':'#f78166'}">${p.status}</span>
      `;
      nodeList.appendChild(card);
    }
  }
}

// ── FPS tracking ──────────────────────────────────────────────────────────
let lastFrame = performance.now();
let frameCount = 0;
let displayFps = 0;

const fpsCounter  = document.getElementById('fps-counter');
const statFps     = document.getElementById('stat-fps');
const statPoints  = document.getElementById('stat-points');
const statNodes   = document.getElementById('stat-nodes');

setInterval(() => {
  displayFps = frameCount;
  frameCount = 0;
  fpsCounter.textContent  = `${displayFps} fps`;
  statFps.textContent     = `FPS ${displayFps}`;
}, 1000);

// ── Socket.IO ─────────────────────────────────────────────────────────────
const socket = io();

socket.on('connect', () => console.log('[DASHBOARD] Connected to server'));
socket.on('disconnect', () => console.log('[DASHBOARD] Disconnected'));

socket.on('fused_frame', (data) => {
  frameCount++;

  const s = pxPerM();

  // clear
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawGrid(s);
  drawTrails(s);
  drawPoints(data.points || [], s);
  drawNodePositions(data.node_positions || [], s);
  drawScaleBar(s);

  updateSidebar(data);

  statPoints.textContent = `Points  ${(data.points || []).length}`;
  statNodes.textContent  = `Nodes   ${(data.node_status || []).length}`;
});
</script>
</body>
</html>
